[project]
name = "velo-engage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.6.0",
    "mlflow==2.13.0",
    "pandas>=2.2,<3",
    "pip>=24",
    "psycopg2-binary>=2.9.12",
    "protobuf>=3.20,<5",
    "pyyaml>=6.0.2",
    "pyarrow>=14,<16",
    "redis>=7.1.0",
    "scikit-learn>=1.9.0",
    "setuptools>=70,<81",
    "neo4j>=5.24.0",
    "catboost>=1.2.7",
    "shap==0.44.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "nats-py>=2.15.0",
    "temporalio>=1.29.0",
    "fastapi>=0.125.0",
    "python-dotenv>=1.2.2",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
]

[tool.uv.workspace]
members = [
    "libs/ve_schemas",
    "services/ve_console",
    "services/ve_measure",
    "services/ve_orchestrator",
    "services/ve_reach",
    "services/ve_connect",
    "services/ve_clinical_intel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ml", "services/ve_connect/src", "services/ve_orchestrator/src", "services/ve_console/src", "services/ve_reach/src", "services/ve_clinical_intel/src"]
