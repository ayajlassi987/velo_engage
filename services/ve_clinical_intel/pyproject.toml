[project]
name = "ve-clinical-intel"
version = "0.1.0"
description = "Clinical note intelligence (MedGemma + NemoGuard) for Velo Engage — runs on GPU infra (DGX Spark), not in the main docker-compose stack"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125.0",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
