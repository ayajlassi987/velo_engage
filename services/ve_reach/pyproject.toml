[project]
name = "ve-reach"
version = "0.1.0"
description = "WhatsApp reach service for Velo Engage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125.0",
    "httpx>=0.28.1",
    "nats-py>=2.15.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "uvicorn>=0.38.0",
    "mlflow==2.13.0",
    "scikit-learn>=1.9.0",
    "pandas>=2.2,<3",
    "twilio>=9.3.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
