[project]
name = "ve-console"
version = "0.1.0"
description = "Operational console for Velo Engage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125.0",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.12",
    "uvicorn>=0.38.0",
    "mlflow==2.13.0",
    "catboost>=1.2.7",
    "pandas>=2.2,<3",
    "pyjwt[crypto]>=2.8.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
